# Nexus V4 — authoritative dependency manifest.
#
# Single source of truth for all runtime + dev deps. Per-service requirements
# files (e.g. serving/avatar-pipeline/requirements.txt) are now thin pointers;
# this file is the canonical pin set.
#
# Install for development (from repo root on NexusBody):
#   py -3.12 -m venv .venv
#   .venv\Scripts\activate
#   pip install -e ".[dev]"
#
# Install runtime-only (production):
#   pip install -e .
#
# Optional extras:
#   pip install -e ".[sovits]"   # GPT-SoVITS upstream stack (NexusServer :9880)
#   pip install -e ".[avatar]"   # Avatar smoke-test audio stack
#
# Python 3.11 is the floor; NexusBody runs 3.12 (cpython-312 in pycache).

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "4.0.0"
description = "Nexus V4 — domain-oriented soul-with-swappable-brain assistant."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Johnathan" }]
license = { text = "Proprietary" }

dependencies = [
    # --- Web framework -----------------------------------------------------
    "fastapi[standard]==0.115.2",
    "uvicorn[standard]==0.32.0",
    "starlette>=0.38,<0.42",

    # --- Config / validation ----------------------------------------------
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "python-dotenv==1.0.1",
    "PyYAML==6.0.2",

    # --- HTTP clients ------------------------------------------------------
    "httpx==0.27.2",
    "requests==2.32.3",

    # --- Persistence -------------------------------------------------------
    "supabase==2.10.0",

    # --- LLM providers -----------------------------------------------------
    "openai==1.54.0",       # Codex (OpenClaw WS) + generic OpenAI-compatible
    "groq==0.11.0",         # Hosted Whisper fallback
    "tiktoken==0.8.0",      # Token counting for Claude budget tracker

    # --- System / ops ------------------------------------------------------
    "psutil==6.1.0",        # observability/metrics, GPU watch
]

[project.optional-dependencies]

# Avatar pipeline smoke-test audio (Edge-TTS, Whisper ASR).
avatar = [
    "edge-tts==6.1.17",
    "soundfile==0.12.1",
    "sounddevice==0.5.1",
    "faster-whisper==1.0.3",
    "numpy>=1.26,<2.1",     # faster-whisper compatible range
    "scipy==1.13.1",        # pinned to numpy<2 track
]

# GPT-SoVITS upstream voice stack — only needed when NexusServer :9880
# is online and Nexus is switched back to the upstream variant.
sovits = [
    "accelerate>=1.0",
    "numpy<2.0",            # SoVITS stack requires numpy<2
    "scipy>=1.11,<1.14",
    "librosa==0.10.2",
    "numba>=0.60",
    "pytorch-lightning>=2.4",
    "gradio>=5,<6",
    "ffmpeg-python>=0.2",
    "torchaudio>=2.4",
    "modelscope==1.10.0",
    "transformers>=4.43",
    "ctranslate2>=4.0,<5",
    "huggingface_hub>=0.13",
    "tokenizers>=0.13,<1",
    "av>=13",
    "sentence-transformers>=3",
    "faiss-cpu==1.12.0",
    "google-genai>=0.3",
]

# Development: lint, format, test.
dev = [
    "ruff==0.15.0",         # matches .ruff_cache/0.15.0
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx>=0.27",          # used as fastapi.TestClient transport
]

[project.urls]
Documentation = "file:///C:/Users/Nexus/Nexus/.claude/CLAUDE.md"
Status = "file:///C:/Users/Nexus/Nexus/STATUS.md"

# ----------------------------------------------------------------------------
# Package discovery — explicit, namespace-aware.
# kv_cache and (future) data_pipeline rely on PEP 420 implicit namespace
# packages; other domains use classic __init__.py packages.
# ----------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = [
    "api_gateway*",
    "serving*",
    "safety*",
    "orchestration*",
    "observability*",
    "kv_cache*",
    # "data_pipeline*",   # re-enable after Track C rename (hyphen → underscore)
]
exclude = [
    "serving.avatar-pipeline*",   # has its own requirements.txt for now
    "tests*",
    "docs*",
    "voices*",
    "model-registry*",
]
namespaces = true

# ----------------------------------------------------------------------------
# Ruff — lint + format. Matches existing .ruff_cache/0.15.0 usage.
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = [".", "api_gateway", "serving", "safety", "orchestration", "observability", "kv_cache"]
exclude = [
    ".ruff_cache",
    "__pycache__",
    ".venv",
    "voices",
    "model-registry",
    "data-pipeline",   # hyphenated — will re-enable after Track C rename
    "Nexus-V4-archive",
    "serving/avatar-pipeline/client",   # JS
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PL",  # pylint (subset)
]
ignore = [
    "E501",     # line-too-long — deferred to formatter
    "PLR0913",  # too many args — fastapi endpoints naturally have many deps
    "PLR2004",  # magic numbers — acceptable in config/scoring code
    "B008",     # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------------------------
# Pytest — unit + async integration tests.
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: hits real Supabase / Ollama / NexusServer",
    "slow: >5s to run",
    "requires_gpu: needs CUDA-capable NexusBody GPU",
]
